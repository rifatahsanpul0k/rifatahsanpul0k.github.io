<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Resume | Md. Rifat Ahasan Pulock</title><meta name="description" content="Resume of Md. Rifat Ahasan Pulock — backend developer and AI/ML researcher."><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="./index.css"></head><body><div class="nav-wrap no-print"><nav class="shell nav"><a class="brand" href="/">RIFAT / PULOK</a><div class="nav-links"><a href="/">Home</a><a href="/projects.html">Projects</a><a class="active" href="/resume.html">Resume</a></div><button class="btn primary" onclick="window.print()">Print / Save PDF</button></nav></div><main class="shell"><section class="page-hero"><div class="eyebrow">Résumé</div><h1>Backend engineering, full-stack systems, and ML research.</h1><p id="summary"></p></section><section class="resume-grid"><aside class="resume-side"><div class="resume-block"><h2>Contact</h2><p id="contact"></p></div><div class="resume-block"><h2>Education</h2><div id="education"></div></div><div class="resume-block"><h2>Technical stack</h2><div id="skills"></div></div></aside><div class="resume-main"><div class="resume-block"><h2>Selected projects</h2><div id="projects"></div></div><div class="resume-block"><h2>Research</h2><div id="research"></div></div></div></section><footer class="footer"><span>© 2026 Md. Rifat Ahasan Pulock</span><span>Backend Engineer · AI/ML Researcher</span></footer></main><script type="module">const res=await fetch('./user.json');const data=await res.json();document.getElementById('summary').textContent=data.bio;document.getElementById('contact').innerHTML=`<a href="mailto:${data.contact.email}">${data.contact.email}</a><br><a href="${data.contact.github}" target="_blank">GitHub</a><br><a href="${data.contact.linkedin}" target="_blank">LinkedIn</a><br>${data.location}`;document.getElementById('education').innerHTML=data.education.map(e=>`<div class="resume-item"><h3>${e.degree}</h3><div class="resume-meta">${e.period}</div><p>${e.school}<br>${e.details}</p></div>`).join('');document.getElementById('skills').innerHTML=Object.entries(data.skills).map(([k,v])=>`<div class="resume-item"><h3>${k.replace(/^./,c=>c.toUpperCase())}</h3><p>${v.join(' · ')}</p></div>`).join('');document.getElementById('projects').innerHTML=data.projects.slice(0,4).map(p=>`<div class="resume-item"><h3><a href="${p.link}" target="_blank">${p.title} ↗</a></h3><p>${p.description}</p><div class="resume-meta">${p.tech.join(' · ')}</div></div>`).join('');document.getElementById('research').innerHTML=`<div class="resume-item"><h3>${data.research.title}</h3><p>${data.research.description}</p><p>${data.research.dataset}</p><div class="resume-meta">${data.research.tech.join(' · ')}</div></div>`;</script></body></html>
